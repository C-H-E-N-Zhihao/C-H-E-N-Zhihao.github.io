      - company: LAMP - CVC - UAB
        company_url: https://lamp.cvc.uab.es/
        position: Undergraduate Student Researcher
        location: Barcelona, Spain
        start_date: 2026-02
        end_date: 2026-09
        summary: Unified Multi-Modal Continual Learning
        highlights:
          - Formulated a sequential benchmark to measure cross-modal catastrophic forgetting between visual reasoning and image synthesis in unified multimodal generative models.
          - Found that decoupled architectures mitigate bidirectional representation degradation compared with monolithic architectures.
          - Awarded the Elena Maseras Research Scholarship 2026 for academic excellence (13% acceptance rate).

      - company: IRI - UPC
        company_url: https://www.iri.upc.edu/index.php
        position: Undergraduate Student Researcher
        location: Barcelona, Spain
        start_date: 2026-02
        end_date: 2026-09
        summary: Future Action Prediction in Video Models
        highlights:
          - Developed WarmFlow, an encoder-initialized flow-matching framework that replaces pure-noise diffusion with dynamic structural priors for action segmentation.
          - Achieved competitive generative coherence with one function evaluation (NFE=1), reducing computation by 10x-25x for latency-critical applications.

      - company: BioRob - EPFL
        company_url: https://www.epfl.ch/labs/biorob/
        position: Visiting Student Researcher
        location: Lausanne, Switzerland
        start_date: 2025-09
        end_date: 2026-02
        summary: Context-Aware Spatial Action Recognition
        highlights:
          - Extended the SkateFormer architecture for multimodal spatial action recognition, using geometric priors to generalize to occluded layouts.
          - Curated a 10k-sample dataset and deployed the framework on a ROS2 mobile swarm, achieving a 20% accuracy gain over baselines and 25ms latency for closed-loop control.

      - company: PayRetailers
        position: AI Engineer Intern
        location: Barcelona, Spain
        start_date: 2025-06
        end_date: 2025-08
        summary: Multi-Agent Systems and LLM Analysis
        highlights:
          - Evaluated prompting strategies, including chain-of-thought and few-shot prompting, and connected LLMs to external tools through multi-agent workflows.
          - Built internal B2B AI solutions, including retrieval-augmented generation systems and automated analytical pipelines.

